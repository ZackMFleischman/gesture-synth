<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Arp Lab</title>
  <style>
    :root { color-scheme: dark; --ink: #e8eef5; --muted: rgba(232,238,245,.6); --line: rgba(255,255,255,.18); --arp: #4fb3ff; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0f14; color: var(--ink); font: 14px/1.4 system-ui, sans-serif; }
    main { max-width: 760px; margin: 0 auto; padding: 20px 16px 40px; display: grid; gap: 16px; }
    h1 { font-size: 18px; margin: 0; display: flex; align-items: center; gap: 10px; }
    .badge { border: 1.5px solid var(--arp); background: color-mix(in srgb, var(--arp) 15%, transparent); border-radius: 999px; padding: 2px 12px; font-size: 13px; }
    section { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
    h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; font-weight: 600; }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .row > .label { min-width: 64px; color: var(--muted); }
    button, select { background: transparent; color: inherit; border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
    button.on, button[aria-pressed=true] { background: color-mix(in srgb, var(--arp) 30%, transparent); border-color: var(--arp); font-weight: 600; }
    #startBtn { font-weight: 600; min-width: 90px; }
    #chordName { font-size: 26px; font-weight: 600; }
    #chordDetail { color: var(--muted); }
    #note { font-variant-numeric: tabular-nums; color: var(--muted); }
    canvas { width: 100%; height: 64px; display: block; background: #121821; border-radius: 10px; }
    input[type=range] { accent-color: var(--arp); width: 160px; }
  </style>
</head>
<body>
<main>
  <h1><span class="badge">Arp</span> Arp lab</h1>

  <section aria-label="Transport">
    <div class="row">
      <button id="startBtn" type="button">Start</button>
      <span id="chordName">A</span><span id="chordDetail">I, voicing 1</span>
      <span id="note"></span>
    </div>
    <canvas id="dots"></canvas>
  </section>

  <section aria-label="Left hand (chord)">
    <h2>Left hand: chord</h2>
    <div class="row"><span class="label">Key</span><select id="key"></select>
      <span class="label" style="min-width:auto;margin-left:8px">Tone</span>
      <select id="tone"><option value="triangle">Warm</option><option value="sawtooth">Bright</option><option value="square">Retro</option></select>
    </div>
    <div class="row" id="degrees"><span class="label">Degree</span></div>
    <div class="row"><span class="label">Quality</span>
      <button type="button" id="major" class="on">Major</button><button type="button" id="minor">Minor</button>
      <button type="button" id="rest" aria-pressed="false" title="Left fist: the arp rests, the clock keeps going">Rest (fist)</button>
    </div>
  </section>

  <section aria-label="Right hand">
    <h2>Right hand</h2>
    <div class="row" id="voicings"><span class="label">Voicing</span></div>
    <div class="row"><span class="label">Filter</span><input id="tilt" type="range" min="-1" max="1" step="0.01" value="0" aria-label="Filter (tilt)" /></div>
  </section>

  <section aria-label="Arp settings">
    <h2>Arp settings</h2>
    <div id="controls"></div>
  </section>
</main>

<script type="module">
  import { createLabCtx, KEY_NAMES } from "./arp-lab-ctx.js";
  import { createArpMode } from "../src/modes/arp.js";
  import { midiName } from "../src/modes/arp-patterns.js";

  const params = new URLSearchParams(location.search);
  const ctx = createLabCtx({ bpm: Number(params.get("bpm")) || 120 });
  const arp = createArpMode();
  const $ = (id) => document.getElementById(id);

  // Test hooks: every step as the clock emitted it (index, play time, beat, step length, and `at` = the
  // context time when it was emitted, so tests can tell a starved main thread from a scheduler error).
  const stepLog = [];
  ctx.clock.onStep((i, time, info) =>
    stepLog.push({ i, time, beat: info.beat, beats: info.stepBeats, dur: info.stepDur, at: ctx.audio.ac.currentTime }));

  function start() {
    ctx.audio.ac.resume();
    stepLog.length = 0;
    ctx.clock.start();
    syncAll();
  }
  function stop() {
    ctx.clock.stop();
    syncAll();
  }
  $("startBtn").addEventListener("click", () => (ctx.clock.running ? stop() : start()));

  // Chord picker
  for (const k of KEY_NAMES) $("key").append(new Option(k, k));
  const chordState = { degree: 1, isMajor: true, rest: false };
  const pick = () => { ctx.harmony.pick({ key: $("key").value, ...chordState }); arp.update(null, ctx); syncAll(); };
  $("key").addEventListener("change", pick);
  ["I", "II", "III", "IV", "V", "VI", "VII"].forEach((r, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = r; b.dataset.degree = String(i + 1);
    b.addEventListener("click", () => { chordState.degree = i + 1; pick(); });
    $("degrees").append(b);
  });
  $("major").addEventListener("click", () => { chordState.isMajor = true; pick(); });
  $("minor").addEventListener("click", () => { chordState.isMajor = false; pick(); });
  $("rest").addEventListener("click", () => { chordState.rest = !chordState.rest; pick(); });
  $("tone").addEventListener("change", () => ctx.audio.setWaveform($("tone").value));

  // Right hand stand-ins
  [1, 2, 3, 4].forEach((v) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = String(v); b.dataset.voicing = String(v);
    b.addEventListener("click", () => arp.set({ voicing: v }));
    $("voicings").append(b);
  });
  $("tilt").addEventListener("input", () => ctx.audio.setFilter(Number($("tilt").value)));

  // Screen controls need the mode's params, so enter it right away with the clock stopped.
  arp.enter(ctx);
  ctx.clock.stop();
  arp.controls($("controls"), ctx);

  function syncAll() {
    const c = ctx.harmony.chord;
    const s = arp.state;
    $("startBtn").textContent = ctx.clock.running ? "Stop" : "Start";
    $("startBtn").classList.toggle("on", ctx.clock.running);
    $("chordName").textContent = c ? c.name : "—";
    $("chordDetail").textContent = c ? `${c.roman}, voicing ${s.voicing}` : "rest (left fist)";
    for (const b of $("degrees").querySelectorAll("button")) b.classList.toggle("on", Number(b.dataset.degree) === chordState.degree);
    for (const b of $("voicings").querySelectorAll("button")) b.classList.toggle("on", Number(b.dataset.voicing) === s.voicing);
    $("major").classList.toggle("on", chordState.isMajor);
    $("minor").classList.toggle("on", !chordState.isMajor);
    $("rest").setAttribute("aria-pressed", String(chordState.rest));
  }
  arp.onChange(syncAll);
  syncAll();

  // Frame loop: what the router would do each video frame (right hand absent -> last values).
  const canvas = $("dots");
  const g = canvas.getContext("2d");
  function frame() {
    const dpr = window.devicePixelRatio || 1;
    const w = Math.round(canvas.clientWidth * dpr), h = Math.round(canvas.clientHeight * dpr);
    if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
    arp.update(null, ctx);
    g.clearRect(0, 0, w, h);
    // Lab canvas is short: draw the bar centred vertically by shifting the bottom-anchored drawing.
    g.save(); g.translate(0, -(h / 2 - 28 * dpr)); arp.drawTransport(g, ctx); g.restore();
    const now = ctx.audio.ac.currentTime;
    const cur = [...arp.steps].reverse().find((st) => st.time <= now);
    $("note").textContent = ctx.clock.running && cur ? (cur.midi == null ? "rest" : midiName(cur.midi)) : "";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__lab = { ctx, arp, stepLog, start, stop, pick: (o) => { Object.assign(chordState, o); if (o.key) $("key").value = o.key; pick(); } };
</script>
</body>
</html>
